<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../scripts/news/story.css">
</head><body>
<h1>Is your smart TV listening to you?</h1>
<p>Some techies now refuse to give it the wifi password.</p>
<svg id="s" width="960" height="870" viewBox="0 0 960 870"></svg>
<script src="../../scripts/news/story.js"></script>
<script>
backdrop();

// data cloud collecting ads data
const cloud = g({});
offsetShape('path', {d: 'M 760 130 q -40 0 -36 -36 q 4 -34 42 -30 q 10 -36 54 -30 q 40 6 40 40 q 36 2 34 30 q -2 26 -34 26 z'}, C.soft, cloud);
el('text', {x: 818, y: 112, 'text-anchor': 'middle', 'font-weight': 700, 'font-size': 26, fill: INK}, cloud).textContent = 'Ads';

// wifi icon above the TV
const wifi = g({});
[0, 1, 2].forEach(k => el('path', {d: `M ${510 - 18 - k * 18} ${100 - k * 10} q ${18 + k * 18} ${-22 - k * 10} ${36 + k * 36} 0`, fill: 'none', stroke: C.navy, 'stroke-width': 7, 'stroke-linecap': 'round'}, wifi));
el('circle', {cx: 510, cy: 108, r: 7, fill: C.navy}, wifi);
const cross = el('path', {d: 'M 478 40 L 542 112 M 542 40 L 478 112', stroke: C.coral, 'stroke-width': 10, 'stroke-linecap': 'round', fill: 'none'});

// TV on a cabinet
offsetShape('rect', {x: 310, y: 470, width: 400, height: 170, rx: 10}, C.orange);
el('line', {x1: 510, y1: 480, x2: 510, y2: 630, class: 'o'});
el('rect', {x: 480, y: 434, width: 60, height: 38, fill: '#fff', class: 'o'});
offsetShape('rect', {x: 320, y: 140, width: 380, height: 296, rx: 14}, C.navy);
const screen = el('rect', {x: 338, y: 158, width: 344, height: 260, rx: 6, fill: INK});
// spy mode: a big ear and a blinking REC light
const spy = g({});
el('path', {d: 'M 490 230 q 0 -46 44 -46 q 44 0 44 50 q 0 34 -30 50 q -14 8 -14 30 q 0 28 -30 28 q -22 0 -28 -18', fill: C.orange, class: 'o', 'stroke-width': 5}, spy);
el('path', {d: 'M 514 236 q 0 -24 22 -24 q 22 0 22 26 q 0 16 -16 22', fill: 'none', class: 'o', 'stroke-width': 5}, spy);
const rec = el('circle', {cx: 372, cy: 190, r: 12, fill: C.coral}, spy);
el('text', {x: 392, y: 199, 'font-weight': 700, 'font-size': 24, fill: '#fff'}, spy).textContent = 'REC';
// show mode: a calm landscape
const show = g({});
el('rect', {x: 338, y: 158, width: 344, height: 260, rx: 6, fill: C.soft}, show);
el('circle', {cx: 610, cy: 218, r: 30, fill: C.mustard, class: 'o', 'stroke-width': 3}, show);
el('path', {d: 'M 338 418 L 338 330 Q 420 250 500 330 Q 580 270 682 340 L 682 418 Z', fill: C.teal, class: 'o', 'stroke-width': 3}, show);
el('rect', {x: 338, y: 158, width: 344, height: 260, rx: 6, fill: 'none', class: 'o'});

// data packets flying from TV to the cloud
const packets = [0, 1, 2].map(() => {
  const p = g({});
  el('rect', {x: -18, y: -13, width: 36, height: 26, rx: 4, fill: C.mustard, class: 'o', 'stroke-width': 3}, p);
  el('path', {d: 'M -18 -13 l 18 14 l 18 -14', fill: 'none', class: 'o', 'stroke-width': 3}, p);
  return p;
});

// sound waves from the speaker to the TV
const waves = [0, 1, 2].map(k => el('path', {d: `M ${232 + k * 26} ${270 - k * 16} q ${16 + k * 6} ${30 + k * 16} 0 ${60 + k * 32}`, fill: 'none', stroke: C.mustard, 'stroke-width': 7, 'stroke-linecap': 'round'}));

// router on the floor
offsetShape('rect', {x: 770, y: 572, width: 150, height: 58, rx: 10}, C.teal);
el('line', {x1: 800, y1: 572, x2: 790, y2: 520, class: 'o', 'stroke-width': 6});
el('line', {x1: 890, y1: 572, x2: 900, y2: 520, class: 'o', 'stroke-width': 6});
const lights = [0, 1, 2].map(k => el('circle', {cx: 812 + k * 30, cy: 602, r: 7, fill: C.teal, class: 'o', 'stroke-width': 2}));

// the person and their speech bubble
const me = person(0, {shirt: C.coral, hair: INK});
limb('M 64 352 Q 40 420 90 440', C.coral, me.p);
const arm = limb('M 164 352 Q 190 400 150 440', C.coral, me.p);
offsetShape('rect', {x: 14, y: 70, width: 270, height: 92, rx: 20}, C.soft);
el('rect', {x: 14, y: 70, width: 270, height: 92, rx: 20, fill: '#fff', class: 'o'});
el('path', {d: 'M 100 160 l 10 34 l 22 -36', fill: '#fff', class: 'o'});
el('rect', {x: 98, y: 152, width: 40, height: 8, fill: '#fff'});
const say = el('text', {x: 149, y: 128, 'text-anchor': 'middle', 'font-weight': 700, 'font-size': 26, fill: INK});

function render(t) {
  const cut = t >= 0.55;
  spy.setAttribute('opacity', cut ? 0 : 1); show.setAttribute('opacity', cut ? 1 : 0);
  rec.setAttribute('opacity', ((t * 6) % 1) < 0.5 ? 1 : 0.2);
  cross.setAttribute('opacity', cut ? 1 : 0);
  wifi.setAttribute('opacity', cut ? 0.35 : 1);
  cloud.setAttribute('opacity', cut ? 0.3 : 1);
  say.textContent = cut ? 'No wifi for you!' : 'Pizza tonight?';
  me.happy(cut);
  arm.forEach(a => a.setAttribute('d', cut ? 'M 164 352 Q 210 300 200 240' : 'M 164 352 Q 190 400 150 440'));
  waves.forEach((w, k) => w.setAttribute('opacity', cut ? 0 : (((t * 3) % 1) > k / 3 ? 1 : 0.15)));
  packets.forEach((p, k) => {
    const ph = (t * 2.4 + k / 3) % 1;
    p.setAttribute('transform', `translate(${740 + ph * 50} ${210 - ph * 60})`);
    p.setAttribute('opacity', cut ? 0 : 1 - ph);
  });
  lights.forEach((l, k) => l.setAttribute('fill', cut ? '#c3cde0' : (((t * 5 + k / 3) % 1) < 0.5 ? C.teal : C.mustard)));
  screen.setAttribute('transform', `translate(${cut ? 0 : 1.5 * Math.sin(t * 60)} 0)`);
}
render(1);
</script>
</body></html>
